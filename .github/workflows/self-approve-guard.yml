name: self-approve-guard
# Second check for PRs from agent-pr: the App PR must change only self-approve folders.
# pull_request_target runs this file from the base branch, so a PR cannot change the check.
# Do not checkout PR code here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the App PR changes only self-approve folders
        # Other PRs pass: another person reviews them. SELF_APPROVE_APP is the App slug.
        if: github.event.pull_request.user.login == format('{0}[bot]', vars.SELF_APPROVE_APP)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # The files API returns at most 3000 files, so a bigger PR could hide files.
          [ "$CHANGED" -lt 3000 ] || { echo "::error::Too many files"; exit 1; }
          # Old paths of renamed files count too.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          # Folders of all users. agent-pr already checked the requester's own folders.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/.github/self-approve.json?ref=$BASE" \
            | jq -r '.[][]' > "$RUNNER_TEMP/allowed-folders.txt"
          while read -r file; do
            allowed=false
            while read -r folder; do
              # A folder must end with "/", so "docs/" does not match "docs-x/".
              if [[ "$folder" == */ && "$file" == "$folder"* ]]; then allowed=true; fi
            done < "$RUNNER_TEMP/allowed-folders.txt"
            if [ "$allowed" = false ]; then
              echo "::error::App PR changes files outside self-approve folders"
              echo "Not allowed: $file"
              exit 1
            fi
          done < "$RUNNER_TEMP/changed-files.txt"
