name: agent-pr
# Opens a PR as the App, so the requester can approve it in self-approve zones.
# The App key lives only in the agent-pr environment, which only main can use.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch, already pushed
        required: true
      title:
        description: PR title
        required: true
permissions: {}
jobs:
  open:
    runs-on: ubuntu-latest
    environment: agent-pr
    steps:
      # Pinned by SHA: this action gets the App private key.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Copy branch to bot/ and open PR as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          # triggering_actor, not actor: on a re-run, actor stays the first requester.
          ACTOR: ${{ github.triggering_actor }}
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ && "$BRANCH" != *..* ]] || { echo "::error::Invalid branch name"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          # Check zones here too: a guard result belongs to a SHA, and a human PR can give an out-of-zone SHA a pass.
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha")
          # compare lists at most 300 files.
          [ "$(jq '.files | length' <<<"$compare")" -lt 300 ] || { echo "::error::Too many files"; exit 1; }
          rules=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/.github/self-approve.json?ref=main")
          # A folder must end with "/", so "docs/" does not match "docs-x/".
          jq -e --arg u "$ACTOR" --argjson rules "$rules" '
            ($rules[$u] // []) as $dirs
            | ($dirs | length > 0 and all(endswith("/")))
              and ([.files[] | .filename, (.previous_filename // empty)]
                   | all(. as $f | $dirs | any(. as $d | $f | startswith($d))))' <<<"$compare" >/dev/null \
            || { echo "::error::$ACTOR may not self-approve these files"; exit 1; }
          ref="bot/$BRANCH"
          # The App must move the PR head ref itself, so the last push is not the requester's.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" -f sha="$sha" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$ref" -f sha="$sha"
          if [ -z "$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY_OWNER}:$ref&state=open" --jq '.[0].number')" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f head="$ref" -f base=main -f title="$TITLE" \
              -f body="Requested by: $ACTOR" --jq .html_url
          fi
